name: YouTube Shorts Automation

on:
  # Every day at 9:30 AM UTC (3 PM IST) — change as needed
  schedule:
    - cron: '30 9 * * *'
  # Manual trigger from GitHub Actions tab — works from your phone
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build video only, do NOT upload to YouTube'
        required: false
        default: 'false'
        type: boolean
      story_id:
        description: 'Specific story ID (leave blank for today''s story)'
        required: false
        default: ''
        type: string

jobs:
  make-short:
    name: Make & Upload Short
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies (ffmpeg + fonts)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg fonts-dejavu fonts-liberation
          echo "FFmpeg version: $(ffmpeg -version 2>&1 | head -1)"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install edge-tts>=6.1.9 gtts>=2.5.1 requests Pillow numpy

      - name: List available stories (for debugging)
        run: python shorts/make_short.py --list-stories

      - name: Build and upload Short
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          STORY_ARG=""
          if [ -n "${{ github.event.inputs.story_id }}" ]; then
            STORY_ARG="--story-id=${{ github.event.inputs.story_id }}"
          fi
          python shorts/make_short.py \
            --dry-run="${{ github.event.inputs.dry_run || 'false' }}" \
            $STORY_ARG

      - name: Show results
        if: always()
        run: |
          echo "=== manifest.json ==="
          cat shorts/output/manifest.json 2>/dev/null || echo "(no manifest)"
          echo ""
          echo "=== output directory ==="
          ls -lh shorts/output/ 2>/dev/null || echo "(no output dir)"

      - name: Upload video as workflow artifact (for debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shorts-output-${{ github.run_id }}
          path: shorts/output/
          retention-days: 7
          if-no-files-found: warn
