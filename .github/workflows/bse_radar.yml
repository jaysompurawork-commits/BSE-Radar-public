name: BSE Radar Bot

on:
  schedule:
    # Pre-market: 8:15 AM IST = 2:45 AM UTC (weekdays)
    - cron: '45 2 * * 1-5'
    # Intraday: every 10 min, 9:30 AM–3:00 PM IST = 4:00–9:30 AM UTC (weekdays)
    - cron: '*/10 4-9 * * 1-5'
    # Post-market: 3:45 PM IST = 10:15 AM UTC (weekdays)
    - cron: '15 10 * * 1-5'

  # Manual trigger from GitHub Actions tab
  workflow_dispatch:
    inputs:
      report_type:
        description: 'Report type to send'
        required: true
        default: 'pre'
        type: choice
        options:
          - pre
          - intraday
          - post

jobs:
  pre-market:
    name: Pre-Market Brief (8:15 AM IST)
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'schedule' && github.event.schedule == '45 2 * * 1-5') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.report_type == 'pre')

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance pandas numpy requests

      - name: Send pre-market brief
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_IDS:  ${{ secrets.TELEGRAM_CHAT_IDS }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          REPORT_TYPE: pre
        run: python bse-radar-bot/bse_radar_bot.py

  intraday:
    name: Intraday Update (every 10 min)
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'schedule' && github.event.schedule == '*/10 4-9 * * 1-5') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.report_type == 'intraday')

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance pandas numpy requests

      - name: Send intraday report
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_IDS:  ${{ secrets.TELEGRAM_CHAT_IDS }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          REPORT_TYPE: intraday
        run: python bse-radar-bot/bse_radar_bot.py

  post-market:
    name: Post-Market Report (3:45 PM IST)
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'schedule' && github.event.schedule == '15 10 * * 1-5') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.report_type == 'post')

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance pandas numpy requests

      - name: Send post-market report
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_IDS:  ${{ secrets.TELEGRAM_CHAT_IDS }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          REPORT_TYPE: post
        run: python bse-radar-bot/bse_radar_bot.py
